<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #13131f;
            color: #4ecca3;
            font-family: 'JetBrains Mono', monospace, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            border: 2px solid #2a2a45;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .coord {
            display: flex;
            gap: 15px;
        }
        span { color: #7c6af7; }
    </style>
</head>
<body>
    <div class="coord">
        <div><span>X:</span> <span id="x" style="color:#e8e8f0">0</span></div>
        <div><span>Y:</span> <span id="y" style="color:#e8e8f0">0</span></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('update-coords', (_, pt) => {
            document.getElementById('x').textContent = pt.x;
            document.getElementById('y').textContent = pt.y;
        });
    </script>
</body>
</html>
