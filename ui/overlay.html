<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: transparent; 
            cursor: crosshair; 
            user-select: none; 
            font-family: sans-serif;
        }
        #selection { 
            position: absolute; 
            border: 4px dashed white; 
            background: rgba(255, 255, 255, 0.6); 
            display: none; 
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hint">🔲 Segure e arraste com o botão DIREITO para mapear uma área. (ESC cancelar)</div>
    <div id="selection"></div>
    <script>
        const { ipcRenderer } = require('electron');
        let startX, startY, isDrawing = false;
        const sel = document.getElementById('selection');

        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousedown', (e) => {
            if (e.button !== 2) return; // Só botão direito
            isDrawing = true;
            startX = e.clientX;
            startY = e.clientY;
            sel.style.left = startX + 'px';
            sel.style.top = startY + 'px';
            sel.style.width = '0px';
            sel.style.height = '0px';
            sel.style.display = 'block';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const currentX = e.clientX;
            const currentY = e.clientY;
            
            const x = Math.min(startX, currentX);
            const y = Math.min(startY, currentY);
            const w = Math.abs(currentX - startX);
            const h = Math.abs(currentY - startY);
            
            sel.style.left = x + 'px';
            sel.style.top = y + 'px';
            sel.style.width = w + 'px';
            sel.style.height = h + 'px';
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDrawing || e.button !== 2) return;
            isDrawing = false;
            
            const x = Math.min(startX, e.clientX);
            const y = Math.min(startY, e.clientY);
            const w = Math.abs(e.clientX - startX);
            const h = Math.abs(e.clientY - startY);
            
            if (w > 5 && h > 5) {
                ipcRenderer.send('region-selected', { x, y, w, h });
            } else {
                sel.style.display = 'none';
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') ipcRenderer.send('overlay-canceled');
        });
    </script>
</body>
</html>
