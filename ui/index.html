<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>ImgBot – Regiões</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d0d14; --surface: #13131f; --surface2: #1a1a2e;
            --border: #2a2a45; --accent: #7c6af7; --accent2: #4ecca3;
            --text: #e8e8f0; --muted: #6e6e9a; --radius: 12px;
        }
        body { font-family: 'Inter', sans-serif; background: transparent; color: var(--text); height: 100vh; overflow: hidden; user-select: none; }
        .app { background: rgba(13,13,20,0.92); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 18px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,0.6); }
        .titlebar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; -webkit-app-region: drag; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
        .titlebar .logo { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
        .titlebar .logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .titlebar .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
        .close-btn { -webkit-app-region: no-drag; background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-btn:hover { background: #f75c5c; border-color: #f75c5c; color: white; }
        
        .content { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow: hidden; }
        .instructions { background: rgba(124,106,247,0.1); border: 1px solid rgba(124,106,247,0.3); padding: 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.5; color: #b6b6d3; }
        .key-badge { display: inline-block; background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        
        .regions-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
        .regions-list::-webkit-scrollbar { width: 4px; }
        .regions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        .empty-state { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
        
        .region-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; position: relative; }
        .r-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
        .r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .r-grid div { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
        .r-grid div span { color: var(--muted); font-family: 'Inter', sans-serif; font-size: 11px; margin-right: 4px; }
        
        .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 13px; }
        .btn-clear:hover { border-color: #f75c5c; color: #f75c5c; }
    </style>
</head>
<body>
<div class="app">
    <div class="titlebar">
        <div class="logo"><div class="dot"></div><span>ImgBot Áreas</span></div>
        <button class="close-btn" onclick="ipcRenderer.send('close-app')">✕</button>
    </div>
    <div class="content">
        <div class="instructions">
            <b>Mapeamento Sem Sobreposição (Timer)</b><br>
            Como o Linux bloqueia as telas transparentes, usamos um cronômetro de 3 segundos para capturar a posição do mouse.<br><br>
            
            <button class="btn-primary" onclick="setOriginTimer()" id="btn-origin" style="margin-bottom:8px;">📍 Setar Origem (3s)</button>
            <div id="origin-status" style="margin-bottom:15px; font-weight:600; color:var(--accent2)">Origem atual: Não definida</div>
            
            <button class="btn-primary" onclick="mapRegionTimer()" id="btn-region">🔲 Mapear Nova Área (Passo 1/2)</button>
        </div>
        <div class="regions-list" id="regions-list">
            <div class="empty-state">Nenhuma área mapeada ainda.</div>
        </div>
        <button class="btn-clear" onclick="clearRegions()">Apagar Todas as Áreas</button>
    </div>
</div>
<script>
const { ipcRenderer } = require("electron");

let regions = [];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function waitAndCapture(btnId, prefixText) {
    const btn = document.getElementById(btnId);
    const originalText = btn.textContent;
    btn.disabled = true;
    
    for (let i = 3; i > 0; i--) {
        btn.textContent = `${prefixText} em ${i}...`;
        await sleep(1000);
    }
    
    btn.textContent = "Capturando...";
    const pt = await new Promise(resolve => {
        ipcRenderer.once('mouse-captured', (_, coords) => resolve(coords));
        ipcRenderer.send('capture-mouse');
    });
    
    btn.textContent = originalText;
    btn.disabled = false;
    return pt;
}

async function setOriginTimer() {
    const pt = await waitAndCapture('btn-origin', 'Posicione o mouse');
    ipcRenderer.send('set-origin', pt);
}

async function mapRegionTimer() {
    const btn = document.getElementById('btn-region');
    // Ponto 1 (Top Left)
    const pt1 = await waitAndCapture('btn-region', 'Ponto 1 (Top-Left)');
    
    btn.style.background = "linear-gradient(135deg, #f75c5c, #ff8a8a)";
    // Ponto 2 (Bottom Right)
    const pt2 = await waitAndCapture('btn-region', 'Ponto 2 (Bottom-Right)');
    btn.style.background = "";
    
    const x = Math.min(pt1.x, pt2.x);
    const y = Math.min(pt1.y, pt2.y);
    const w = Math.abs(pt2.x - pt1.x);
    const h = Math.abs(pt2.y - pt1.y);
    
    if (w > 5 && h > 5) {
        ipcRenderer.send('save-region', { x, y, w, h });
    }
}

function clearRegions() {
    regions = [];
    renderRegions();
}

function renderRegions() {
    const list = document.getElementById("regions-list");
    if (regions.length === 0) {
        list.innerHTML = '<div class="empty-state">Nenhuma área mapeada ainda.</div>';
        return;
    }
    list.innerHTML = regions.map((r, i) => `
        <div class="region-card">
            <div class="r-title">Área ${i + 1}</div>
            <div class="r-grid">
                <div><span>X Rel:</span> ${r.relX}</div>
                <div><span>Y Rel:</span> ${r.relY}</div>
                <div><span>W (Largura):</span> ${r.w}px</div>
                <div><span>H (Altura):</span> ${r.h}px</div>
            </div>
        </div>
    `).join("");
    // Scroll para o fim
    list.scrollTop = list.scrollHeight;
}

ipcRenderer.on("origin-set", (_, origin) => {
    document.getElementById("origin-status").textContent = `Origem atual: (${origin.x}, ${origin.y})`;
});

ipcRenderer.on("new-region", (_, bounds) => {
    regions.push(bounds);
    renderRegions();
});
</script>
</body>
</html>
